name: qualification-gates-contract

on:
  pull_request:
    branches: [import-current]
    paths:
      - 'scripts/integration_qualification.sh'
      - 'scripts/final_qualification.py'
      - 'scripts/test_final_qualification_contract.py'
      - '.github/workflows/qualification-gates-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate final release conjunction and blocker semantics
        run: python3 scripts/test_final_qualification_contract.py
      - name: Assert integration harness remains fail-closed without provider configuration
        shell: bash
        run: |
          set +e
          env -u NEWSROOM_PROVIDER -u NEWSROOM_MODEL bash scripts/integration_qualification.sh >/tmp/integration-no-provider.out 2>&1
          code=$?
          set -e
          cat /tmp/integration-no-provider.out
          test "$code" -eq 64
