name: deterministic-contracts

on:
  pull_request:
    branches: [main, import-current]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deterministic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Source integrity verifier and tamper detection
        run: python3 scripts/test_source_integrity_contract.py
      - name: Backend routing threshold contract from measured macOS baseline
        run: python3 scripts/check_backend_routing_baseline.py
      - name: Measured business-value aggregation contract
        run: python3 scripts/test_business_value_benchmark.py
      - name: Agentic evaluator and repeated-trial reliability contract
        run: python3 scripts/test_agentic_qualification_harness.py
      - name: Agentic live harness fails closed without provider configuration
        shell: bash
        run: |
          set +e
          env -u NEWSROOM_PROVIDER -u NEWSROOM_MODEL bash scripts/agentic_qualification.sh >/tmp/agentic-no-provider.out 2>&1
          code=$?
          set -e
          cat /tmp/agentic-no-provider.out
          test "$code" -eq 64
      - name: Visual browser/GPU normalization and blocker semantics
        run: python3 scripts/test_visual_qualification_contract.py
      - name: Final release conjunction and blocker semantics
        run: python3 scripts/test_final_qualification_contract.py
      - name: Integration harness fails closed without provider configuration
        shell: bash
        run: |
          set +e
          env -u NEWSROOM_PROVIDER -u NEWSROOM_MODEL bash scripts/integration_qualification.sh >/tmp/integration-no-provider.out 2>&1
          code=$?
          set -e
          cat /tmp/integration-no-provider.out
          test "$code" -eq 64
      - name: Recompute candidate source integrity deterministically
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/update_source_integrity.py --root . --manifest source-integrity.json
          python3 scripts/check_source_integrity.py --root . --manifest source-integrity.json
      - name: Upload rebound source integrity
        uses: actions/upload-artifact@v4
        with:
          name: source-integrity-rebound
          path: source-integrity.json
          if-no-files-found: error
          retention-days: 30
