name: business-benchmark-contract

on:
  pull_request:
    branches: [import-current]
    paths:
      - 'scripts/business_value_benchmark.py'
      - 'scripts/test_business_value_benchmark.py'
      - '.github/workflows/business-benchmark-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate measured business-value aggregation contract
        run: python3 scripts/test_business_value_benchmark.py
