name: parallel-audit-contract

on:
  pull_request:
    branches: [import-current]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-audit-projection:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Tahoe Arm64 baseline
        shell: bash
        run: |
          set -euo pipefail
          version="$(sw_vers -productVersion)"
          arch="$(uname -m)"
          case "$version" in 26.*) ;; *) echo "Expected macOS 26.x, got $version" >&2; exit 2 ;; esac
          test "$arch" = "arm64" || { echo "Expected arm64, got $arch" >&2; exit 2; }
      - name: Install Rust 1.98.1
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal
          rustup run 1.98.1 rustc --version
          rustup run 1.98.1 cargo --version
      - name: Reconstruct production Rust sources from bootstrap staging
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, glob
          parts = sorted(glob.glob('bootstrap-staging/source.b64.part-*'))
          if not parts:
              raise SystemExit('no bootstrap source fragments found')
          data = b''.join(open(path, 'rb').read() for path in parts)
          open('/tmp/newsroom-bootstrap.tar.xz', 'wb').write(base64.b64decode(data))
          PY
          mkdir -p /tmp/newsroom-bootstrap
          tar -tJf /tmp/newsroom-bootstrap.tar.xz >/tmp/bootstrap-files.txt
          tar -xJf /tmp/newsroom-bootstrap.tar.xz -C /tmp/newsroom-bootstrap
          source_root="$(find /tmp/newsroom-bootstrap -type f -path '*/src/audit.rs' -print -quit | sed 's#/src/audit.rs$##')"
          test -n "$source_root" || { echo 'bootstrap archive has no src/audit.rs' >&2; exit 3; }
          test -f "$source_root/src/artifact.rs"
          mkdir -p rust-audit-contract/production rust-audit-contract/src rust-audit-contract/tests
          cp "$source_root/src/audit.rs" rust-audit-contract/production/audit.rs
          cp "$source_root/src/artifact.rs" rust-audit-contract/production/artifact.rs
          grep -q 'parallel_batch_duration_ms' rust-audit-contract/production/audit.rs
          grep -q 'parallel_resource_peak_concurrency' rust-audit-contract/production/audit.rs
          grep -q 'parallel_backend_distribution' rust-audit-contract/production/audit.rs
          grep -q 'parallel_batch_duration_ms' rust-audit-contract/production/artifact.rs
          grep -q 'parallel_resource_peak_concurrency' rust-audit-contract/production/artifact.rs
          grep -q 'parallel_backend_distribution' rust-audit-contract/production/artifact.rs
      - name: Build contract crate around production audit and artifact modules
        shell: bash
        run: |
          set -euo pipefail
          cat > rust-audit-contract/Cargo.toml <<'EOF'
          [package]
          name = "parallel-audit-contract"
          version = "0.1.0"
          edition = "2021"

          [dependencies]
          anyhow = "1.0"
          chrono = { version = "0.4", features = ["serde"] }
          serde = { version = "1.0", features = ["derive"] }
          serde_json = "1.0"
          EOF
          cat > rust-audit-contract/src/lib.rs <<'EOF'
          pub mod tool_registry {
              pub fn capability_class(name: &str) -> Option<&'static str> {
                  match name {
                      "newsroom_update_plan" => Some("planning"),
                      "duckdb_query" => Some("computation"),
                      "fetch_url" => Some("discovery"),
                      _ => None,
                  }
              }
              pub fn is_capability_class(class: Option<&str>) -> bool {
                  matches!(class, Some("discovery" | "computation" | "evidence" | "synthesis" | "visual" | "publication"))
              }
          }

          pub mod hash {
              use std::io::Result as IoResult;
              use std::path::Path;
              pub fn sha256_bytes(_data: &[u8]) -> String { "0".repeat(64) }
              pub fn sha256_file(_path: &Path) -> IoResult<String> { Ok("0".repeat(64)) }
          }

          #[path = "../production/audit.rs"]
          pub mod audit;
          #[path = "../production/artifact.rs"]
          pub mod artifact;
          EOF
          cat > rust-audit-contract/tests/projection.rs <<'EOF'
          use parallel_audit_contract::{artifact::InvestigationBundle, audit::AuditSummary};
          use serde_json::Value;
          use std::collections::BTreeMap;
          use std::fs;
          use std::time::{SystemTime, UNIX_EPOCH};

          fn audit_fixture() -> AuditSummary {
              AuditSummary {
                  schema_version: "0.8.0",
                  generated_at: "2026-09-15T00:00:00Z".to_string(),
                  turns: 1,
                  tool_calls: 2,
                  capability_tool_calls: 2,
                  successful_capability_tool_calls: 1,
                  failed_tool_calls: 1,
                  automatic_retries: 0,
                  plan_revisions: 1,
                  successful_plan_calls: 1,
                  follow_up_goals: 0,
                  distinct_capability_classes: 2,
                  capability_classes: BTreeMap::new(),
                  autonomous_execution_observed: true,
                  adaptive_replanning_observed: true,
                  tool_failure_recovery_observed: true,
                  follow_up_replanning_observed: false,
                  parallel_batches: 1,
                  parallel_tasks: 3,
                  failed_parallel_tasks: 1,
                  parallel_blocked_tasks: 1,
                  parallel_batch_duration_ms: 23,
                  max_observed_parallelism: 2,
                  parallel_resource_task_counts: BTreeMap::from([
                      ("local".to_string(), 1),
                      ("network".to_string(), 1),
                      ("data".to_string(), 1),
                  ]),
                  parallel_resource_duration_ms: BTreeMap::from([
                      ("local".to_string(), 7),
                      ("network".to_string(), 11),
                      ("data".to_string(), 5),
                  ]),
                  parallel_resource_peak_concurrency: BTreeMap::from([
                      ("local".to_string(), 1),
                      ("network".to_string(), 1),
                      ("data".to_string(), 1),
                  ]),
                  parallel_backend_distribution: BTreeMap::from([
                      ("macos:shasum".to_string(), 1),
                      ("portable:fetch".to_string(), 1),
                  ]),
                  parallel_execution_observed: true,
                  tools: BTreeMap::new(),
                  calls: vec![],
              }
          }

          #[test]
          fn production_projection_reaches_story_and_run_metrics() {
              let stamp = SystemTime::now().duration_since(UNIX_EPOCH).unwrap().as_nanos();
              let root = std::env::temp_dir().join(format!("parallel-audit-contract-{stamp}"));
              fs::create_dir_all(&root).unwrap();
              let bundle = InvestigationBundle::create(&root, "parallel audit contract").unwrap();
              bundle.write_session_stats(&serde_json::json!({"userMessages": 1})).unwrap();
              let audit = audit_fixture();
              bundle.write_manifest("parallel audit contract", Some("test"), Some("model"), "completed", Some(&audit)).unwrap();
              bundle.append_run_metric("investigate", Some("test"), Some("model"), "completed", 42, Some(&audit)).unwrap();

              let story: Value = serde_json::from_str(&fs::read_to_string(&bundle.manifest_path).unwrap()).unwrap();
              let autonomy = &story["autonomy"];
              assert_eq!(autonomy["parallel_blocked_tasks"], 1);
              assert_eq!(autonomy["parallel_batch_duration_ms"], 23);
              assert_eq!(autonomy["max_observed_parallelism"], 2);
              assert_eq!(autonomy["parallel_resource_task_counts"]["network"], 1);
              assert_eq!(autonomy["parallel_resource_duration_ms"]["network"], 11);
              assert_eq!(autonomy["parallel_resource_peak_concurrency"]["network"], 1);
              assert_eq!(autonomy["parallel_backend_distribution"]["portable:fetch"], 1);

              let metric_text = fs::read_to_string(&bundle.run_metrics_path).unwrap();
              let metric: Value = serde_json::from_str(metric_text.trim()).unwrap();
              assert_eq!(metric["parallel_blocked_tasks"], 1);
              assert_eq!(metric["parallel_batch_duration_ms"], 23);
              assert_eq!(metric["max_observed_parallelism"], 2);
              assert_eq!(metric["parallel_resource_task_counts"]["local"], 1);
              assert_eq!(metric["parallel_resource_duration_ms"]["data"], 5);
              assert_eq!(metric["parallel_resource_peak_concurrency"]["local"], 1);
              assert_eq!(metric["parallel_backend_distribution"]["macos:shasum"], 1);
              let _ = fs::remove_dir_all(root);
          }
          EOF
      - name: Compile and run production Rust audit contract
        shell: bash
        run: |
          set -euo pipefail
          rustup run 1.98.1 cargo test --manifest-path rust-audit-contract/Cargo.toml --all-targets
