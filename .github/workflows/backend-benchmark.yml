name: backend-benchmark

on:
  push:
    branches: [import-current]
    paths:
      - 'runtime/pi/local_backend.mjs'
      - 'runtime/pi/parallel_scheduler.mjs'
      - 'scripts/benchmark_local_backend_matrix.mjs'
      - 'scripts/macos_parallel_smoke.mjs'
      - '.github/workflows/backend-benchmark.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Tahoe Arm64 baseline
        shell: bash
        run: |
          set -euo pipefail
          version="$(sw_vers -productVersion)"
          arch="$(uname -m)"
          case "$version" in 26.*) ;; *) echo "Expected macOS 26.x, got $version" >&2; exit 2 ;; esac
          test "$arch" = "arm64" || { echo "Expected arm64, got $arch" >&2; exit 2; }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
      - name: Run macOS local-first backend benchmark matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-evidence
          node scripts/benchmark_local_backend_matrix.mjs > ci-evidence/local-backend-benchmark.json
          cat ci-evidence/local-backend-benchmark.json
      - name: Upload backend benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: local-backend-benchmark-macos-26
          path: ci-evidence/local-backend-benchmark.json
          if-no-files-found: error
          retention-days: 30
