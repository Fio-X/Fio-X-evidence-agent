name: verifier-optimize-once

on:
  push:
    branches: [iteration-next]
    paths:
      - '.github/workflows/verifier-optimize-once.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: iteration-next
          fetch-depth: 1
      - name: Apply request-safe root resolution cache
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/verify_artifact.py')
          text = path.read_text(encoding='utf-8')

          old_imports = "import argparse\nimport hashlib\n"
          new_imports = "import argparse\nimport functools\nimport hashlib\n"
          if old_imports not in text:
              raise SystemExit('expected import block not found')
          text = text.replace(old_imports, new_imports, 1)

          old = '''def safe_ref(root: Path, ref: str) -> Path:\n    p = PurePosixPath(ref)\n    if not ref or p.is_absolute() or ".." in p.parts:\n        raise ValueError(f"unsafe relative artifact reference: {ref!r}")\n    full = root.joinpath(*p.parts)\n    try:\n        full.resolve().relative_to(root.resolve())\n    except ValueError as exc:\n        raise ValueError(f"artifact reference escapes root: {ref!r}") from exc\n    return full\n'''
          new = '''@functools.lru_cache(maxsize=32)\ndef _resolved_root(root: Path) -> Path:\n    # Artifact roots are immutable for the duration of one verifier process.\n    # Cache only the root canonicalization; child refs are still resolved on\n    # every check so symlink/path escape mutations remain fail-closed.\n    return root.resolve()\n\n\ndef safe_ref(root: Path, ref: str) -> Path:\n    p = PurePosixPath(ref)\n    if not ref or p.is_absolute() or ".." in p.parts:\n        raise ValueError(f"unsafe relative artifact reference: {ref!r}")\n    full = root.joinpath(*p.parts)\n    try:\n        full.resolve().relative_to(_resolved_root(root))\n    except ValueError as exc:\n        raise ValueError(f"artifact reference escapes root: {ref!r}") from exc\n    return full\n'''
          if old not in text:
              raise SystemExit('expected safe_ref implementation not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python3 -m py_compile scripts/verify_artifact.py
          git diff --check -- scripts/verify_artifact.py
          git diff -- scripts/verify_artifact.py
      - name: Run verifier correctness regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/selftest_evaluator.py
          python3 scripts/test_integrity_adversarial.py
      - name: Run verifier performance gates
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/benchmark_verify.py
          python3 scripts/benchmark_verify_scale.py
      - name: Commit optimized verifier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify_artifact.py
          git diff --cached --quiet && { echo 'no verifier change produced' >&2; exit 2; }
          git commit -m 'Cache verifier root resolution'
          git push origin HEAD:iteration-next
