          node scripts/test_qa_empty_pass_shapes.mjs
          node scripts/test_qa_no_empty_pass_fixtures.mjs
      # The two off-state byte comparisons (flow maps back against 46c3624, flow-map labels against the tree before the label layer) need history;
      # fetch-depth is 0 above, and a SKIP here would be a failure, not a pass.
      - name: Flow-map tests (a skipped comparison fails)
        env:
          NEWSROOM_REQUIRE_NO_SKIP: "1"
        run: |
          git worktree add --detach "$RUNNER_TEMP/flow-labels-base" 35cb1cf
          BASE="$RUNNER_TEMP/flow-labels-base"
          node scripts/test_flow_maps_back.mjs
          node scripts/test_flow_trunk_cap.mjs
          node scripts/test_zh_route_disclosure.mjs
          node scripts/test_flow_extent_hint.mjs
          node scripts/test_flow_styles.mjs
          BASE_WT="$BASE" node scripts/test_flow_map_labels.mjs
          node scripts/test_flow_map_round3.mjs
          BASE_WT="$BASE" node scripts/test_flow_map_round3_b.mjs
      - name: Rust ↔ Pi mock control-plane acceptance
        run: ./scripts/test_control_plane.sh
      - name: Investigate and continue exit-code acceptance
        run: python3 scripts/test_investigate_exit_codes.py
      - name: Visualization performance budget
        run: node scripts/benchmark_viz.mjs
      - name: Complex visualization performance budget
        run: node scripts/benchmark_complex_viz.mjs
      # Every scripts/test_* file not named above and not in ci/test-exclusions.txt.
      # A skip is a failure here; scripts/test_ci_covers_all_tests.py keeps the split complete.
      - name: Remaining script tests (all files not named above or excluded)
        env:
          NEWSROOM_REQUIRE_NO_SKIP: "1"
          NEWS_BIN: target/debug/news
        run: python3 scripts/run_all_script_tests.py
      # Known-red files run and report here; a failure does not fail the job, so each shows its
      # real result on CI and leaves ci/test-exclusions.txt as soon as it is green.
      - name: Known-red script tests (reported, not blocking)
        continue-on-error: true
        env:
          NEWSROOM_REQUIRE_NO_SKIP: "1"
          NEWS_BIN: target/debug/news
        run: python3 scripts/run_all_script_tests.py --known-red
      # Only when the job fails: the SVGs and hash table test_small_multiples_outlier.mjs keeps for a case
      # that does not match its pin, so a Linux-only render difference can be diffed against macOS.
      - name: Upload small-multiples render mismatch
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: small-multiples-outlier-mismatch
          path: outputs/small-multiples-outlier-mismatch/
          if-no-files-found: ignore
          retention-days: 7

  macos-native-contracts:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the byte-comparison tests need the base commits; a shallow clone skips them
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.1'
      - name: Build CLI for the record-only tests (they need target/debug/news)
        run: cargo build --bin news
      - name: Install the pinned DuckDB CLI
        run: python3 -m pip install --disable-pip-version-check duckdb-cli==1.5.5
      - name: Verify macOS-native executables
        run: |
          test -x /usr/bin/sqlite3
          test -x /usr/bin/plutil
          test -x /usr/bin/textutil
      - name: macOS-native result-budget and replay contracts
        env:
          NEWSROOM_REQUIRE_NO_SKIP: "1" # a skipped half is a failure here, not a pass
        run: |
          node scripts/test_local_sqlite_safety.mjs
          node scripts/test_duckdb_bundled_ext.mjs
          node scripts/test_local_result_budget.mjs
          node scripts/test_parallel_tool_contract.mjs
          node scripts/test_parallel_result_budget.mjs
          node scripts/test_parallel_replay_wiring.mjs
          node scripts/test_tool_result_budget_integration.mjs
          node scripts/test_followup_alt_source.mjs
          node scripts/test_reader_task_example_fix.mjs
          node scripts/test_scene_duplicate_wording.mjs
          node scripts/test_refused_options_fix.mjs
          node scripts/test_extreme_probe.mjs
          node scripts/test_extreme_note.mjs
          node scripts/test_footer_notes.mjs
          node scripts/test_page_ocr.mjs
          node scripts/test_record_only.mjs
          # Review split (always on): the render-QA record is the critic's.
          for t in compact_variant_runtime extreme_note page_inline_claim; do node scripts/test_$t.mjs; done
          node scripts/test_publication_reject_writer.mjs
          # Every record-only switch on: the existing proofs must still pass unchanged.
