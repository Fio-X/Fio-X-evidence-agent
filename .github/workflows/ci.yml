          node scripts/test_cjk_viz.mjs
          node scripts/test_viz_ticks.mjs
          node scripts/test_economy_names.mjs
          node scripts/test_location_evidence.mjs
          node scripts/test_location_evidence_render.mjs
          node scripts/test_location_evidence_symbol_render.mjs
          node scripts/test_location_evidence_symbol_us_render.mjs
          node scripts/test_location_evidence_kind.mjs
          node scripts/test_verified_locations_backed.mjs
          node scripts/test_range_bracket.mjs
          python3 scripts/selftest_evaluator.py
          python3 scripts/test_integrity_adversarial.py
          python3 scripts/test_pdf_source_verifier.py
          python3 scripts/test_infographic_revision_rejected_manifest.py
          python3 scripts/benchmark_verify.py
          python3 scripts/test_benchmark_verify_reference.py
          python3 scripts/test_benchmark_verify_gate.py
          python3 scripts/benchmark_verify_scale.py
          python3 scripts/test_recompute_protocol.py
          python3 scripts/test_qualification_summary.py
          node scripts/test_rich_illustration.mjs
          node scripts/test_vision_contract.mjs
          node scripts/test_groups.mjs
          node scripts/test_group_boundary.mjs
          node scripts/test_group_handoff.mjs
          node scripts/test_group_enforce.mjs
          node scripts/test_decision_handoff.mjs
          node scripts/test_run_as_writer_users.mjs
          node scripts/test_group_handoff_table.mjs
          node scripts/test_knowledge_writer_content.mjs
          node scripts/test_group_coverage.mjs
          node scripts/test_runtime_materialize_rules.mjs
          node scripts/test_group_cross_calls.mjs
          node scripts/test_k321_tool_allow.mjs
          node scripts/test_k330_tool_pin.mjs
          node scripts/test_staged_preview_svg.mjs
          node scripts/test_group_module_calls.mjs
          node scripts/test_group_rust_raw_writes.mjs
          node scripts/test_group_raw_write_sites.mjs
          node scripts/test_k315_export_wrap.mjs
          node scripts/test_group_cross_call_gate.mjs
          node scripts/test_group_exempt_record.mjs
          node scripts/test_group_exempt_lists_match.mjs
          node scripts/test_group_four_tools_records.mjs
          node scripts/test_inner_tool_record.mjs
