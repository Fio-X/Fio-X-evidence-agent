      - name: Complex visualization semantic smoke tests
        run: |
          node scripts/test_complex_viz.mjs
          node scripts/test_complex_realdata_viz.mjs
          node scripts/test_realdata_viz.mjs
      - name: Complex visualization SVG snapshots
        run: node scripts/test_complex_snapshots.mjs
      - name: Reader-facing render QA gates
        run: |
          node scripts/test_font_floor.mjs
          node scripts/test_page_embed_labels.mjs
          node scripts/test_render_qa_geometry.mjs
          node scripts/test_render_qa_contrast.mjs
          node scripts/test_render_qa_tick_compact.mjs
