          node scripts/test_review_from_records.mjs
          python3 scripts/test_review_from_records.py
          node scripts/test_review_command_record.mjs
          python3 scripts/test_review_command_record.py
          node scripts/test_review_dimension_reader.mjs
          python3 scripts/test_review_dimension_reader.py
          python3 scripts/test_review_dimension_mutants.py
          node scripts/test_dimension_review_page.mjs
          python3 scripts/test_dimension_review_page_mutants.py
          python3 scripts/test_group_commands.py
          python3 scripts/test_infographic_preview.py
          python3 scripts/test_cjk_preview_raster.py
      - name: Verification switch tests
        run: |
          node scripts/test_tool_defs_unchanged.mjs
          node scripts/test_refusal_keys.mjs
          node scripts/test_one_chart_text.mjs
          node scripts/test_d3_plan_refusal.mjs
          node scripts/test_scatter_paired.mjs
          node scripts/test_chart_measures_tool_path.mjs
          node scripts/test_font_floor_anisotropic.mjs
          node scripts/test_render_qa_labels.mjs
          node scripts/test_source_cut_wellformed.mjs
          node scripts/test_named_highlight_partial.mjs
          node scripts/test_k59_stat_row_range.mjs
          python3 scripts/test_source_cut_snapshot.py
          python3 scripts/test_choropleth_value_labels_verify.py
