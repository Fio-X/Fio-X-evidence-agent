name: ci

on:
  push:
  pull_request:

jobs:
  rust-and-newsroom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - name: Python test dependencies
        run: |
          python3 -m pip install --disable-pip-version-check jsonschema==4.26.0 duckdb-cli==1.5.5 CairoSVG==2.8.2 networkx==3.6.1 scipy==1.18.1 basemap==2.0.0 matplotlib==3.10.8
      - name: Install pinned Pi runtime
        run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent@0.85.1
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --all-targets
      - name: Build CLI for live-runtime acceptance
        run: cargo build --bin news
      - name: Verify pinned live runtime
        run: target/debug/news doctor --strict --json
      - name: Real DuckDB replay acceptance
        run: |
          python3 scripts/create_recompute_fixture.py /tmp/newsroom-recompute-real
          target/debug/news verify /tmp/newsroom-recompute-real --recompute
      - name: Test
        run: cargo test --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Validate JSON schema syntax
        run: |
          python3 -m json.tool schemas/news-artifact.schema.json >/dev/null
          python3 -m json.tool schemas/newsroom-viz-spec.schema.json >/dev/null
          python3 -m json.tool schemas/publication-spec.schema.json >/dev/null
          python3 -m json.tool schemas/map-spec.schema.json >/dev/null
          python3 -m json.tool schemas/fact-graph.schema.json >/dev/null
          python3 -m json.tool schemas/claim-graph.schema.json >/dev/null
          python3 -m json.tool schemas/fact-signature.schema.json >/dev/null
          python3 -m json.tool schemas/evidence-ledger.schema.json >/dev/null
          python3 -m json.tool schemas/editorial-grammar-selection.schema.json >/dev/null
          python3 -m json.tool schemas/art-direction-patch-v2.schema.json >/dev/null
      - name: Validate bundled Pi runtime syntax
        run: |
          node --check runtime/pi/viz.mjs
          node --check runtime/pi/net.mjs
          node --check runtime/pi/provenance.mjs
          node --check runtime/pi/infographic.mjs
          node --check runtime/pi/fact_graph.mjs
          node --check runtime/pi/editorial_grammar.mjs
          node --check runtime/pi/editorial_validators.mjs
          node --check runtime/pi/explanatory.mjs
          node --check runtime/pi/illustration.mjs
          node --check runtime/pi/vision.mjs
          node --check runtime/pi/publication.mjs
          node --check runtime/pi/publication_binding.mjs
          node --check runtime/pi/svg_security.mjs
          node --check runtime/pi/tool_phase_policy.mjs
          node --experimental-strip-types --check runtime/pi/newsroom.ts
      - name: Check release baseline
        run: python3 scripts/check_release_baseline.py
      - name: Check Rust ↔ Pi runtime contract
        run: python3 scripts/check_runtime_contract.py
      - name: Visual-story and portable-publication regressions
        run: |
          python3 scripts/test_fact_editorial_contracts.py
          node scripts/test_fact_editorial_runtime.mjs
          node scripts/test_evidence_gate.mjs
          node scripts/test_computation_row_tables.mjs
          python3 scripts/test_infographic_schema.py
          node scripts/test_cognitive_editorial_validators_v15.mjs
          node scripts/test_infographic.mjs
          python3 scripts/test_migration_flow_fixture.py
          python3 scripts/test_migration_story_ir.py
          node scripts/test_migration_story_ir.mjs
          node scripts/test_bundled_skills.mjs
          node scripts/test_lieflat_catalog.mjs
          node scripts/test_lieflat_report.mjs
          node scripts/test_visual_story_completion.mjs
          node scripts/test_visual_story_routing.mjs
          node scripts/test_evidence_bound_composite.mjs
          node scripts/test_composite_geo_network_sankey.mjs
          node scripts/test_offline_geo_fallback.mjs
          python3 scripts/test_openai_wire_mock.py
          python3 scripts/test_anthropic_wire_mock.py
          python3 scripts/test_pi_prompt_retry.py
          python3 scripts/test_browser_qa_bootstrap.py
          python3 scripts/test_artifact_completion.py
      - name: Qualification contract regressions
        run: |
          python3 scripts/test_source_integrity_contract.py
          python3 scripts/test_business_value_benchmark.py
          python3 scripts/test_agentic_qualification_harness.py
          python3 scripts/test_agentic_trials_batch.py
          python3 scripts/test_latest_artifact_dir.py
          python3 scripts/test_agentic_hardening.py
          python3 scripts/test_visual_qualification_contract.py
          python3 scripts/test_final_qualification_contract.py
          python3 scripts/test_production_qualification_contract_v113.py
      - name: Unified PR release gate
        run: python3 scripts/release_check.py --profile pr --output outputs/ci-release-check-pr.json
      - name: Recompute candidate source integrity deterministically
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/update_source_integrity.py --root . --manifest source-integrity.json
          python3 scripts/check_source_integrity.py --root . --manifest source-integrity.json
      - name: Upload rebound source integrity
        uses: actions/upload-artifact@v4
        with:
          name: source-integrity-rebound
          path: source-integrity.json
          if-no-files-found: error
          retention-days: 30
      - name: Build exact-candidate release manifest
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_release_manifest.py
          python3 -c "import json,os; d=json.load(open('release-manifest.json')); assert d.get('source_commit')==os.environ['GITHUB_SHA']; assert isinstance(d.get('manifest_sha256'),str) and len(d['manifest_sha256'])==64"
      - name: T20 blocked rehearsal on exact candidate
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 scripts/final_qualification.py --release-manifest release-manifest.json --output outputs/v113-final-qualification.json >/tmp/t20-rehearsal.out 2>&1
          code=$?
          set -e
          cat /tmp/t20-rehearsal.out
          test "$code" -eq 2
          python3 -c "import json,os; d=json.load(open('outputs/v113-final-qualification.json')); assert d.get('status')=='BLOCKED'; assert d.get('candidate_source_commit')==os.environ['GITHUB_SHA']; assert d.get('checks',{}).get('release_manifest') is True"
      - name: Upload exact-candidate seal artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: exact-candidate-seal
          path: |
            release-manifest.json
            outputs/v113-final-qualification.json
          if-no-files-found: error
          retention-days: 30
      - name: Visual compiler contract tests
        run: |
          python3 scripts/test_runtime_build_plan_v116.py
          python3 scripts/test_visual_recipe_schema_v117.py
          python3 scripts/test_visual_skill_bundle_v116.py
          python3 scripts/test_graph_extraction_v125.py
          node scripts/test_visual_backend_agent_v116.mjs
          node scripts/test_visual_recipe_v117.mjs
          node scripts/test_graph_backend_v120.mjs
          node scripts/test_web_runtime_contract_v120.mjs
          node scripts/test_echarts_editorial_v121.mjs
          node scripts/test_backend_executor_v118.mjs
          node scripts/test_backend_router_v123.mjs
          node scripts/test_render_cache_v124.mjs
          python3 scripts/test_art_direction_schema_v134.py
          node scripts/test_art_direction_replay_v134.mjs
      - name: Validate NewsroomVizSpec contract
        run: python3 scripts/test_viz_schema.py
      - name: Validate NewsArtifact contract
        run: python3 scripts/test_artifact_schema.py
      - name: Verify offline data-news fixture
        run: python3 scripts/verify_fixture.py
      - name: Provenance and bounded-I/O smoke tests
        run: |
          node scripts/test_content_addressing.mjs
          node scripts/test_stream_limits.mjs
          node scripts/test_cjk_viz.mjs
          python3 scripts/selftest_evaluator.py
          python3 scripts/test_integrity_adversarial.py
          python3 scripts/benchmark_verify.py
          python3 scripts/benchmark_verify_scale.py
          python3 scripts/test_recompute_protocol.py
          python3 scripts/test_qualification_summary.py
          node scripts/test_rich_illustration.mjs
          node scripts/test_vision_contract.mjs
          python3 scripts/test_infographic_preview.py
      - name: Visualization semantic smoke tests
        run: node scripts/test_viz.mjs
      - name: Visualization SVG snapshot tests
        run: node scripts/test_viz_snapshots.mjs
      - name: Complex visualization semantic smoke tests
        run: |
          node scripts/test_complex_viz.mjs
          node scripts/test_complex_realdata_viz.mjs
          node scripts/test_realdata_viz.mjs
      - name: Complex visualization SVG snapshots
        run: node scripts/test_complex_snapshots.mjs
      - name: Rust ↔ Pi mock control-plane acceptance
        run: ./scripts/test_control_plane.sh
      - name: Visualization performance budget
        run: node scripts/benchmark_viz.mjs
      - name: Complex visualization performance budget
        run: node scripts/benchmark_complex_viz.mjs

  macos-native-contracts:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Verify macOS-native executables
        run: |
          test -x /usr/bin/sqlite3
          test -x /usr/bin/plutil
          test -x /usr/bin/textutil
      - name: macOS-native result-budget and replay contracts
        run: |
          node scripts/test_local_result_budget.mjs
          node scripts/test_parallel_tool_contract.mjs
          node scripts/test_parallel_result_budget.mjs
          node scripts/test_parallel_replay_wiring.mjs
          node scripts/test_tool_result_budget_integration.mjs
