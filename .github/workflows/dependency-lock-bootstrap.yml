name: dependency-lock-bootstrap

on:
  workflow_dispatch:

concurrency:
  group: dependency-lock-bootstrap-iteration-next
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-runtime-locks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: iteration-next
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
      - name: Require full runtime package sources
        shell: bash
        run: |
          set -euo pipefail
          test -f src/main.rs || { echo 'BLOCKED: T01 full source is not materialized' >&2; exit 64; }
          for dir in runtime/web runtime/sigma runtime/map runtime/d3; do test -f "$dir/package.json"; done
      - name: Generate real npm lockfiles without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          for dir in runtime/web runtime/sigma runtime/map runtime/d3; do
            (cd "$dir" && npm install --package-lock-only --ignore-scripts --no-audit --no-fund)
            test -s "$dir/package-lock.json"
          done
      - name: Commit runtime lockfiles
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/*/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'Add runtime npm locks for qualification'
          git push origin HEAD:iteration-next
