[package]
name = "pj004-mcp"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A stdio MCP server that lets a host verify a stored run folder by calling `news verify --json`"
publish = false

[[bin]]
name = "pj004-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
rmcp = { version = "=3.8.0", features = ["transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time"] }

[dev-dependencies]
tempfile = "3"
