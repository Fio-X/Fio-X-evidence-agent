<text x="284" y="342.6" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#69727a">Inputs enter the system</text>
<circle cx="320" cy="445.2" r="16" fill="#24313a"/>
<circle cx="320" cy="445.2" r="3.5" fill="#c9473d"/>
<line x1="320" y1="445.2" x2="342" y2="445.2" stroke="#69727a"/>
<text x="356" y="441.2" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#1d2329">Conversion</text>
<text x="356" y="459.2" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#69727a">Some inputs change form</text>
<circle cx="320" cy="561.8" r="16" fill="#24313a"/>
<circle cx="320" cy="561.8" r="3.5" fill="#c9473d"/>
