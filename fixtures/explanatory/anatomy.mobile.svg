<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 920" role="img" aria-labelledby="ex-title ex-desc" data-explainer-version="0.1.0" data-view="anatomy">
<title id="ex-title">How the system is layered</title>
<desc id="ex-desc">A schematic explanatory graphic labels the major layers of a synthetic system and explicitly states that geometry is not to scale.</desc>
<rect width="640" height="920" fill="#fffdf9"/>
