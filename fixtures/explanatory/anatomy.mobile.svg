<text x="284" y="589.8" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#69727a">users</text>
<circle cx="320" cy="678.4" r="16" fill="#24313a"/>
<circle cx="320" cy="678.4" r="3.5" fill="#c9473d"/>
