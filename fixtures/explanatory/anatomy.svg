<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 720" role="img" aria-labelledby="ex-title ex-desc" data-explainer-version="0.1.0" data-view="anatomy">
<title id="ex-title">How the system is layered</title>
<desc id="ex-desc">A schematic explanatory graphic labels the major layers of a synthetic system and explicitly states that geometry is not to scale.</desc>
<rect width="1040" height="720" fill="#fffdf9"/>
<text x="62" y="38" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#c9473d">EXPLAINER</text>
<text x="62" y="72" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="35" font-weight="700" fill="#1d2329">How the system is layered</text>
<text x="62" y="124" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#69727a">Semantic explanatory-graphic regression fixture</text>
<line x1="62" y1="153" x2="978" y2="153" stroke="#d9dde1"/>
<rect x="425" y="219" width="190" height="376" rx="92" fill="#f1f0ec" stroke="#d9dde1" stroke-width="2"/>
<circle cx="520" cy="294.2" r="19" fill="#c9473d"/>
<circle cx="520" cy="294.2" r="3.5" fill="#c9473d"/>
<line x1="520" y1="294.2" x2="498" y2="294.2" stroke="#69727a"/>
<text x="484" y="290.2" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1d2329">Primary supply</text>
<text x="484" y="308.2" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#69727a">Inputs enter the system</text>
<circle cx="520" cy="369.4" r="19" fill="#24313a"/>
<circle cx="520" cy="369.4" r="3.5" fill="#c9473d"/>
<line x1="520" y1="369.4" x2="542" y2="369.4" stroke="#69727a"/>
<text x="556" y="365.4" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1d2329">Conversion</text>
<text x="556" y="383.4" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#69727a">Some inputs change form</text>
<circle cx="520" cy="444.6" r="19" fill="#24313a"/>
<circle cx="520" cy="444.6" r="3.5" fill="#c9473d"/>
<line x1="520" y1="444.6" x2="498" y2="444.6" stroke="#69727a"/>
<text x="484" y="440.6" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1d2329">End use</text>
<text x="484" y="458.6" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#69727a">Useful output reaches users</text>
<circle cx="520" cy="519.8" r="19" fill="#24313a"/>
<circle cx="520" cy="519.8" r="3.5" fill="#c9473d"/>
<line x1="520" y1="519.8" x2="542" y2="519.8" stroke="#69727a"/>
<text x="556" y="515.8" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1d2329">Losses</text>
<text x="556" y="533.8" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#69727a">Some energy exits as losses</text>
