<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 991" role="img" aria-labelledby="viz-title-mobile viz-desc-mobile" data-viewport="mobile">
<title id="viz-title-mobile">A verified newsroom claim moves through six stages</title>
<desc id="viz-desc-mobile">A process schematic shows a report moving from fact extraction and source verification through deterministic computation, drafting, visual review and publication.</desc>
<rect width="640" height="991" fill="#ffffff"/>
<text x="32" y="34" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#202124">A verified newsroom claim moves</text>
<text x="32" y="65" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#202124">through six stages</text>
<defs><marker id="proc-arrow-m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#a9afb5"/></marker></defs>
<path data-role="process-edge" d="M320,160 C320,200.25 320,200.25 320,240.5" fill="none" stroke="#a9afb5" stroke-width="1.8" marker-end="url(#proc-arrow-m)"/>
<text x="320" y="196.25" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="8.2" fill="#687076">ingest</text>
<path data-role="process-edge" d="M320,284.5 C320,324.75 320,324.75 320,365" fill="none" stroke="#a9afb5" stroke-width="1.8" marker-end="url(#proc-arrow-m)"/>
<text x="320" y="320.75" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="8.2" fill="#687076">evidence</text>
<path data-role="process-edge" d="M320,409 C320,449.25 320,449.25 320,489.5" fill="none" stroke="#a9afb5" stroke-width="1.8" marker-end="url(#proc-arrow-m)"/>
<text x="320" y="445.25" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="8.2" fill="#687076">validated data</text>
<path data-role="process-edge" d="M320,533.5 C320,573.75 320,573.75 320,614" fill="none" stroke="#a9afb5" stroke-width="1.8" marker-end="url(#proc-arrow-m)"/>
<text x="320" y="569.75" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="8.2" fill="#687076">result</text>
<path data-role="process-edge" d="M320,658 C320,698.25 320,698.25 320,738.5" fill="none" stroke="#a9afb5" stroke-width="1.8" marker-end="url(#proc-arrow-m)"/>
<text x="320" y="694.25" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="8.2" fill="#687076">story claim</text>
<path data-role="process-edge" d="M320,782.5 C320,822.75 320,822.75 320,863" fill="none" stroke="#a9afb5" stroke-width="1.8" marker-end="url(#proc-arrow-m)"/>
<text x="320" y="818.75" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="8.2" fill="#687076">approved</text>
<rect data-role="process-node" x="260" y="116" width="120" height="44" rx="6" fill="#f2f3f4" stroke="#a9afb5" stroke-width="1.3"/>
<text x="320" y="142" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9.3" font-weight="600" fill="#202124">Report arrives</text>
<rect data-role="process-node" x="260" y="240.5" width="120" height="44" rx="6" fill="#f2f3f4" stroke="#a9afb5" stroke-width="1.3"/>
<text x="320" y="266.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9.3" font-weight="600" fill="#202124">Extract facts</text>
<rect data-role="process-node" x="260" y="365" width="120" height="44" rx="6" fill="#d1493f" stroke="#d1493f" stroke-width="1.3"/>
<text x="320" y="391" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9.3" font-weight="700" fill="#fff">Verify sources</text>
<rect data-role="process-node" x="260" y="489.5" width="120" height="44" rx="6" fill="#f2f3f4" stroke="#a9afb5" stroke-width="1.3"/>
<text x="320" y="515.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9.3" font-weight="600" fill="#202124">Compute metrics</text>
<rect data-role="process-node" x="260" y="614" width="120" height="44" rx="6" fill="#f2f3f4" stroke="#a9afb5" stroke-width="1.3"/>
<text x="320" y="640" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9.3" font-weight="600" fill="#202124">Draft finding</text>
<rect data-role="process-node" x="260" y="738.5" width="120" height="44" rx="6" fill="#f2f3f4" stroke="#a9afb5" stroke-width="1.3"/>
<text x="320" y="764.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9.3" font-weight="600" fill="#202124">Visual review</text>
<rect data-role="process-node" x="260" y="863" width="120" height="44" rx="6" fill="#f2f3f4" stroke="#a9afb5" stroke-width="1.3"/>
<text x="320" y="889" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9.3" font-weight="600" fill="#202124">Publish</text>
<line x1="32" y1="913" x2="608" y2="913" stroke="#d9dde1" stroke-width="1"/>
<text x="32" y="932" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" fill="#687076">Source: Synthetic v0.9 regression fixture</text>
</svg>
