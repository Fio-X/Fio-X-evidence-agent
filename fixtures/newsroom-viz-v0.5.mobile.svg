<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 863" role="img" aria-labelledby="viz-title-mobile viz-desc-mobile" data-viewport="mobile">
<title id="viz-title-mobile">Countries split into two observation years</title>
<desc id="viz-desc-mobile">Two panels separate countries observed in 2021 from countries observed in 2022, preventing a misleading single ranking across mixed years.</desc>
<rect width="640" height="863" fill="#ffffff"/>
