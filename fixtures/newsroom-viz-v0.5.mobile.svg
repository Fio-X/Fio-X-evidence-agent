<text x="32" y="98" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#687076">Renewable energy consumption as a share of total final</text>
<text x="32" y="118" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#687076">energy consumption</text>
<text x="32" y="166" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#202124">2021</text>
