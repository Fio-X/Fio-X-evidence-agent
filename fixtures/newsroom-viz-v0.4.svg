<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 503" role="img" aria-labelledby="viz-title viz-desc">
<title id="viz-title">Countries split into two observation years</title>
<desc id="viz-desc">Two panels separate countries observed in 2021 from countries observed in 2022, preventing a misleading single ranking across mixed years.</desc>
