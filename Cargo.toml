[package]
name = "agentic-data-newsroom"
version = "1.13.0-rc1"
edition = "2021"
license = "MIT"
description = "Rust CLI control plane for a Pi-powered agentic data newsroom"

[[bin]]
name = "news"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
flate2 = "1.1"
reqwest = { version = "0.11", features = ["json"] }
rustyline = { version = "=18.0.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"
tokio = { version = "1.0", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "time"] }
uuid = { version = "1.0", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.14"
# the paused clock (start_paused) the retry waits are tested on, so a wait of seconds takes none
tokio = { version = "1.0", features = ["test-util"] }
